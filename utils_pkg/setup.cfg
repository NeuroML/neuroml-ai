[metadata]
name = klea_utils
version = 0.4.0
author = Ankur Sinha
author_email = ankursinha@fedoraproject.org
url = https://github.com/NeuroML/neuroklea
project_urls =
    Documentation = https://neuroklea.org
    Source = https://github.com/NeuroML/neuroklea
license = GPL-3.0-or-later
description = Shared utilities for Klea packages
long_description = file: Readme.md
long_description_content_type = text/markdown
classifiers=
    Intended Audience :: Science/Research
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering

[options]
install_requires =
    langchain
    # langchain-community is being sunset (no longer actively maintained) and
    # may be removed in a future langchain release; BM25Retriever lives here.
    # If it disappears, vendor the small BM25Retriever wrapper or use rank_bm25
    # directly (see klea_utils/stores/retrieval/bm25.py).
    langchain-community
    langchain-core
    langgraph
    fastmcp
    httpx
    tenacity
    fastapi
    rank_bm25
    # typer must be <0.27 for Python 3.12: docling 2.x (via docling-slim[standard])
    # requires typer<0.27.0, and newer typer otherwise forces docling back to 1.x
    typer>=0.12,<0.27
    cachetools
    uvicorn
    coolname
    platformdirs
    langgraph-checkpoint-sqlite
    aiosqlite

include_package_data = True
packages = find:

[options.packages.find]
where = .

[options.entry_points]
console_scripts =
    klea-stores-create = klea_utils.ui.stores_create:app

[options.package_data]

[options.extras_require]
chroma =
    langchain-chroma
    chromadb

pgvector =
    langchain-postgres

qdrant =
    langchain-qdrant

huggingface =
    langchain-huggingface

ollama =
    langchain-ollama
    ollama

nicegui =
    nicegui

openai =
    langchain-openai

ingest =
    docling
    # typer must be <0.27 for Python 3.12: docling 2.x (via docling-slim[standard])
    # requires typer<0.27.0, and newer typer otherwise forces docling back to 1.x
    typer>=0.12,<0.27
    xxhash
    transformers

full =
    klea_utils[ingest]
    klea_utils[chroma]
    klea_utils[pgvector]
    klea_utils[qdrant]
    klea_utils[huggingface]
    klea_utils[ollama]
    klea_utils[nicegui]

test =
    klea_utils[full]
    pytest
    pytest-asyncio
    pytest-xdist

dev =
    klea_utils[test]
    pre-commit
    isort
    ruff
    mypy

[flake8]
extend-ignore = E501, E502, F403, F405, W503, W504, E251
